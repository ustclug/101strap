name: qcow2 images
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      cache_epoch:
        description: Change this value to rebuild tools and guest packages
        default: '0'
        type: string
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Syntax and ShellCheck
        run: |
          for script in build.sh config.sh image/*.sh assets/*.sh rootfs/*.sh ci/*.sh; do bash -n "$script"; done
          shellcheck build.sh config.sh image/*.sh assets/*.sh rootfs/*.sh ci/*.sh
  build:
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          # Disabled: hosted ARM runners lack nested virtualization/KVM for
          # the libguestfs appliance. Re-enable when acceleration is available.
          # - runner: ubuntu-24.04-arm
          #   arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      ARCH: ${{ matrix.arch }}
      CACHE_EPOCH: ${{ inputs.cache_epoch }}
      CONTAINER_CACHE: gha
      BUILDX_BUILDER: builder-101strap-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
      BUILD_CONTAINER_NAME: 101strap-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
      LIBGUESTFS_BACKEND: direct
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install verification tools
        run: sudo apt-get update && sudo apt-get install -y qemu-utils libguestfs-tools
      - name: Enable KVM access
        if: matrix.arch == 'amd64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm
          test -c /dev/kvm && test -r /dev/kvm && test -w /dev/kvm
      - name: Check host libguestfs
        run: |
          # Ubuntu restricts kernel reads; supermin needs a kernel for its appliance.
          # https://libguestfs.org/guestfs-faq.1.html
          sudo chmod 0644 /boot/vmlinuz-*
          libguestfs-test-tool
      - name: Expose temporary Actions cache credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.setSecret(process.env.ACTIONS_RUNTIME_TOKEN);
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL);
      - name: Build and verify
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/101strap"
          bash ci/build.sh 2>&1 | tee "$RUNNER_TEMP/101strap/job.log"
      - name: Upload verified image and metadata
        uses: actions/upload-artifact@v4
        with:
          name: 101strap-qcow2-${{ matrix.arch }}
          path: |
            dist/${{ matrix.arch }}/root.qcow2
            dist/${{ matrix.arch }}/build-info.txt
            dist/${{ matrix.arch }}/packages.tsv
            dist/${{ matrix.arch }}/build-sources.sha256
            dist/${{ matrix.arch }}/SHA256SUMS
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
      - name: Cleanup on failure or cancellation
        if: always()
        run: python3 ci/cleanup.py
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 101strap-diagnostics-${{ matrix.arch }}
          path: ${{ runner.temp }}/101strap/
          compression-level: 1
          retention-days: 7
